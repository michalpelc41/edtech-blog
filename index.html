<style>

  .post-excerpt { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; color: var(--ink); font-size: 1.02rem; line-height: 1.5; margin-bottom: 18px; overflow-wrap: anywhere; white-space: pre-line; }

  .pager button:disabled { opacity: 0.4; cursor: default; }

  .post-item .tag-row { margin-top: auto; }

  .tag { font-size: 0.8rem; font-weight: 500; color: var(--chip-ink); background: var(--chip-bg); padding: 5px 12px; border-radius: 999px; }
  .draft-badge { display: inline-block; background: var(--chip-bg); color: var(--accent); font-weight: 700; font-size: 0.72rem; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; margin-right: 8px; vertical-align: middle; }

  .empty {
    background: #FFFFFF;

    border-radius: 24px;
    padding: 48px 24px;
    text-align: center;

  @media (max-width: 720px) { .post-view { padding: 24px 20px 32px; } }
  .post-toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 10px; }

  .overlay {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(2px);
    display: flex; justify-content: center;
    padding: 0 20px calc(32px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    z-index: 10;
  }
  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 720px;
    width: 100%;
    height: fit-content;
    margin-top: calc(32px + env(safe-area-inset-top, 0px));
    padding: 28px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.1);

  .panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row-end { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  .editor-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; padding: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
  .toolbar-btn { font-family: inherit; font-size: 0.82rem; font-weight: 500; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1; }
  .toolbar-btn svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar-btn:hover { background: var(--bg); border-color: var(--border); }
  .toolbar-sep { width: 1px; background: var(--border); margin: 2px 4px; }

  .link-popover { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .link-popover input { flex: 1 1 200px; background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 0.9rem; color: var(--ink); }
  .color-popover { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; padding: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
  .video-embed { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; margin: 20px 0; border-radius: 12px; overflow: hidden; background: #000; text-decoration: none; color: var(--ink); }
  .video-embed-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-embed .video-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
  .video-embed-fallback { aspect-ratio: auto; display: flex; align-items: center; gap: 14px; background: var(--surface-2); border: 1.5px solid var(--border); padding: 16px 20px; transition: border-color 0.15s ease; }
  .video-embed-fallback:hover { border-color: var(--accent); }
  .video-embed-fallback .video-play-icon { position: static; transform: none; flex: 0 0 auto; width: 42px; height: 42px; background: var(--accent); color: var(--accent-ink); font-size: 1.05rem; }
  .video-embed-label { font-weight: 600; font-size: 0.96rem; }
  .video-embed-player { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 20px 0; border-radius: 12px; overflow: hidden; background: #000; }
  .video-embed-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .color-swatch { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border); cursor: pointer; padding: 0; }
  .color-swatch:hover { border-color: var(--ink-soft); }

  .article-date { font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--accent); font-size: 0.8rem; margin-bottom: 10px; }
  .article-title { font-size: 1.9rem; line-height: 1.1; margin-bottom: 12px; text-wrap: wrap; }
  .post-view .article-title { max-width: none; margin-inline: max(0px, calc((100% - 760px) / 2)) 0; }
  @media (max-width: 720px) { .article-title { line-height: 1.05; } }
  .article-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .article-body { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 1.15rem; line-height: 1.45; }
  .article-body p, .article-body div { margin: 0 0 1em; overflow-wrap: anywhere; }
  .article-body h1, .article-body h2, .article-body h3 { margin: 1.2em 0 0.5em; font-weight: 700; line-height: 1.15; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }

  .article-body img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 20px 0; }
  .article-body a { color: var(--accent); }

  .about-body { color: var(--ink-mute); font-size: 1rem; line-height: 1.7; }
  .about-body p { margin: 0 0 1em; }

  .confirm-box { background: var(--danger-bg); border: 1.5px solid var(--danger); border-radius: 10px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .confirm-box span { font-size: 0.88rem; color: var(--ink); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: 0.85rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

    ],
    "excerpt": "Historička Emily Kate Genatowski strávila rok s humanoidním robotem a odhalila pět praktických lekcí, které ukazují, že budoucnost AI není o velkých filozofických debatách, ale o řešení každodenních otázek… Článek otevírá témata: jak spolu mohou žít lidé a AI/roboti, kde je hranice mezi pomocí a závislostí na technologiích a jaké úkoly chceme přenechat strojům.",
    "content": "<p><a href=\"https://www.ted.com/talks/emily_kate_genatowski_my_year_living_with_a_robot\" target=\"_blank\" rel=\"noopener\">My year living with a robot<\/a>&nbsp;(Originální TED přednáška v angličtině)<\/p><p><strong>Český přepis přednášky<\/strong><\/p><p>Právě teď je přesně 10:03 GMT. Ale tady ve Vídni je 12:03. Proč? Británie přijala GMT v roce 1847 a oficiálně jej uzákonila v roce 1880. Toto rozhodnutí nevzešlo z nějaké hluboké filozofické diskuse o konceptu času a prostoru. Byla to prostě praktičnost. Potřebovali jsme vědět, kdy budou přijíždět a odjíždět vlaky v jakékoli stanici na rozlehlé železniční trati. Kvůli této potřebě byl místní sluneční čas příliš nepřesný, což si vyžádalo náš moderní koncept časových pásem.<\/p><p>Jsem historička a fascinují mě faktory, které formují technologický pokrok. Od parního stroje přes telefon až po internet – u každého nového inovativního skoku můžeme sledovat propojený vývoj společnosti a technologií.<\/p><blockquote><span style=\"font-style: normal\">Technologickým pokrokem naší generace je AI. Analýza toho, jak AI zapadne do našeho světa a jak jej ovlivní, je fascinující téma, které je ale většinou buď senzacechtivě doprovázeno velkými sliby, nebo katastrofickými scénáři.<\/span><\/blockquote><p>V dnešním světě, který vás nutí „myslet ve velkém“, abyste mohli mluvit o budoucnosti, vás jako historička prosím: myslete v malém.<\/p><p>Historie technologického pokroku a doprovodných regulačních rámců nás učí, že o naší budoucnosti s AI a robotikou nerozhodnou jen velké filozofické debaty, ale praktičnost – hledání odpovědí na tisíce praktických otázek, které vyvstávají z prostých drobností každodenního života.<\/p><p>Pustila jsem se do výzkumného projektu, abych zjistila, co je těchto tisíc otázek zač. <strong>Většinu uplynulého roku jsem strávila životem po boku humanoidního robota s AI.<\/strong> Tento imerzivní projekt mě napadl proto, že se mi v hlavě kupily vlastní otázky. <strong>Mám malého psa. Jak se bude chovat v blízkosti humanoidního robota?<\/strong><\/p><p>😁😁😁<\/p><p><strong>Jak si robot poradí v domě plném křehkých starožitností?<\/strong><\/p><p>Vzhledem k tomu, že továrny po celém světě usilovně pracují na uvedení domácí AI robotiky na trh a virální videa podněcují zvědavost milionů lidí, cítila jsem, že jako historička žijící s robotem mohu pomoci nahlédnout do toho, jak by mohla vypadat budoucnost. Chtěla jsem otevřít zajímavé diskuse, najít mezery v regulaci a experimentovat s komunitními standardy.<\/p><p>Toto je <strong><a href=\"https://www.unitree.com/g1/\" target=\"_blank\" rel=\"noopener\">Unitree G1 EDU-1<\/a><\/strong>. Je vybaven 3D lidarovým skenováním, hloubkovou kamerou a mikrofony. Má velký jazykový model jménem BenBen a disponuje schopnostmi stability a pohybu řízenými AI. Pro mě a mé přátele je to ale Tova, robot, se kterým žiju doma. Každý den s Tovou odhaluje širokou škálu praktických problémů, což ukazuje na potřebu regulace v mnoha různých oblastech.<\/p><p>Dnes se s vámi podělím o pět praktických lekcí, které jsem se jako historička žijící s robotem naučila, a o to, jak tyto lekce souvisejí s budoucností společnosti.<\/p><h2>Lekce první: Musíte si dům „zabezpečit proti robotům“.<\/h2><p>Zmínila jsem, že Tova má lidarové skenování a funkci „vyhýbání se překážkám“. Zní to skvěle, že? Bohužel nás to ne vždy ochrání před neohrabaností. Tova chodí, běhá a gestikuluje. Kvůli těmto gestům jsem bohužel přišla o svůj oblíbený čajový šálek, několik váz a v podstatě o všechny sklenice na víno. Tak jsem zavolala do své pojišťovny, že chci rozšířit pojištění domácnosti a odpovědnosti.<\/p><blockquote>„Dobrý den, tady pojišťovací agent.“<\/blockquote><blockquote>„Dobrý den, tady Emily. Potřebuji rozšířit pojistku.“<\/blockquote><blockquote>„Dobře, co se změnilo?“<\/blockquote><blockquote>„Nastěhoval se ke mně humanoidní robot s AI.“<\/blockquote><blockquote>„Haló?“ 😁😁😁<\/blockquote><blockquote><em>Položili mi to, protože si mysleli, že je to vtip.<\/em><\/blockquote><p>Nedivím se jim, volala jsem jako první. Ale odpovědnost za autonomní robotiku a pojištění je oblast, kde praxe vytvoří precedenty pro mnoho otázek.<\/p><p><strong>Například: Já robota vlastním, firma ho naprogramovala, můj přítel ho ovládá a robot shodí vázu. Kdo je zodpovědný?<\/strong><\/p><p>Vím, že tyto otázky mají daleko k úžasným sci-fi debatám o budoucnosti, které tak milujeme, ale jsou to přesně ty otázky, které vyžadují odpověď v momentě, kdy vám takový robot překročí práh.<\/p><h2>Lekce druhá: Cestování s robotem je dřina.<\/h2><p>Měla jsem tu čest představit Tovu ve vídeňské ranní show. Natáčelo se v ateliérech na okraji města v brzkých ranních hodinách. Tova váží asi 60 kilo a balí se do obří černé bedny.<\/p><p>Ve čtyři ráno jsem zavolala taxi a poprosila řidiče, jestli by mi nepomohl naložit „něco“ do kufru. Šel se podívat, už tak na mě koukal divně, a pak uviděl tu černou bednu velkou jako já. Neochotně se pro ni sehnul, a jakmile ucítil tu váhu, podíval se na mě: „Je v tom mrtvola?“<\/p><p>😁😁😁<\/p><p>Zaváhala jsem – protože technicky vzato je to „tělo“. Vyděsil se. Musela jsem to otevřít a ukázat mu robota, aby se uklidnil.<\/p><p>To otevírá <strong>otázku přepravních předpisů<\/strong>. Taxíky pro velké bedny jsou drahé. Říkala jsem si: <strong>jezdím tramvají, robot má nohy, může prostě nastoupit a sednout si, ne?<\/strong> Pak mě napadlo: co když přijde revizor a bude chtít jízdenku, když robot zabírá místo? Napsala jsem dopravnímu podniku, že chci pro svého robota roční kartu. Nedopadlo to dobře. Odpověděli, že každá žádost musí být doložena doklady o registraci obyvatele. Ty nemám. Tak jsem šla na policii, že chci někoho zaregistrovat k pobytu. „Koho?“ „Svého humanoidního robota.“ Vyrazili mě ze dveří.<\/p><p>Nedivím se jim. Ale pokud nám tito roboti mají pomáhat, přirozeně to znamená, že občas vyjdou ven. Mohou nás doprovázet, něco nám nést nebo skočit do obchodu pro chybějící ingredienci při vaření. <strong>Musíme najít a regulovat způsob, jak to dělat bezpečně pro majitele, roboty i ostatní lidi ve městě.<\/strong><\/p><h2>Lekce třetí: Roboti nejsou vždy vítáni.<\/h2><p>Mám přátele, kteří mě prosí: „Mám o víkendu oslavu, vezmi robota, je to cool!“ Na druhou stranu mám kolegy, kteří mi píšou: „Jestli dneska nechceš brát robota, je to v pořádku.“ Nechtějí ho tam. Respektuji neformální pravidla, která se začínají tvořit. Mám domácího robota, takže v profesorských kabinetech na univerzitě není potřeba. <strong>Přátelé, kteří mají batolata, ho doma nechtějí<\/strong>. <strong>A<\/strong> <strong>nesmí ani do náboženských objektů<\/strong>. Jsou to neformální omezení, která plně respektuji. Ale co se stane, až se takových robotů vyexpedují miliony do různých komunit s různými názory?<\/p><p>Musíme formulovat komunitní standardy. Ty mohou určit, <strong>kde jsou roboti vítáni, co smí a nesmí dělat.<\/strong> Může to mít různé podoby: zóny pro roboty a zakázané zóny (podobně jako u elektrokoloběžek), nálepky na dveřích obchodů „zákaz vstupu se zvířaty i roboty“, nebo státem vydávané průkazy pro roboty s individuálním povolením. Je na nás, jak se rozhodneme.<\/p><h2>Lekce čtvrtá: Svého robota můžete poslat do práce.<\/h2><p>Tova byla doma a já šla s kamarádem, který si otevřel kavárnu. Vtipkoval: „Vezmi Tovu, ať mi pomůže v obchodě.“ Zasmáli jsme se, ale vrtalo mi to hlavou. Pak jsme ji tam vzali a ona se naučila v obchodě pomáhat. <strong>Debata o nahrazování práce roboty je plná katastrofických prohlášení typu „roboti nám seberou práci“.<\/strong> Jsou to fascinující i děsivé diskuse, ale potřebujeme i ty praktické: <strong>Jak by měl vypadat spravedlivý daňový systém? Budeme danit prodej robota, nebo hodnotu, kterou vytvoří?<\/strong> Půjdou ty peníze do sociálního systému, nebo zavedeme nepodmíněný příjem? Tato strašení musí ustoupit praktickým debatám o zachování finančních systémů při současném využití efektivity AI.<\/p><h2>Lekce pátá: Roboti v nás probouzejí to nejlepší i to nejhorší.<\/h2><p>Každé ráno venčím psa na náměstí a beru i robota. Reakce jsou různé. Jednou tam byla matka, která stála od robota tak daleko, jak to jen šlo, ale povzbuzovala své děti: „Běžte si promluvit.“ Děti měly skvělé otázky: „Co se mám učit, abych mohl pracovat s roboty?“, „Může mi zamávat?“, „Můžu s ním závodit?“. Velmi milé. Na druhou stranu druhý den přišel starší pán a pokusil se Tově utrhnout ruku. Když jsem se ho zeptala, co dělá, řekl: „Ale, jen staré dobré pevné podání ruky.“ No, vypadalo to jinak.<\/p><p>Lidé mají zkrátka velmi odlišné reakce dané věkem, kulturou nebo mediálními obrazy – od toho, co ráno viděli na mobilu, až po to, zda byl jejich prvním vzorem robot Data ze Star Treku nebo C-3PO z Hvězdných válek. A když se pak ocitnou před skutečným robotem, mohou být zklamaní. <strong>Potřebujeme více interakce mezi veřejností a robotikou, abychom lidem ukázali realitu a mohli vést praktické diskuse založené na skutečnosti.<\/strong><\/p><p>Neviditelná ruka praktičnosti bude i nadále utvářet historii. Takže místo toho, abychom se nechali pohltit senzacechtivým strachem nebo nadšením, prosím, abychom tyto diskuse přenesli do reality. <strong>Přijměme praktickou povahu života s AI, zatímco se společně připravujeme na regulaci budoucnosti.<\/strong><\/p><p>Až se s vámi příště někdo bude chtít bavit o robotické apokalypse, řekněte mu: „Dobře, ale myslíš si, že robot v tramvaji potřebuje jízdenku?“<\/p>",

    "content": "<p><a class=\"video-embed video-embed-fallback\" href=\"https://www.youtube.com/watch?v=9-HWtslv6is\" target=\"_blank\" rel=\"noopener\"><span class=\"video-play-icon\">▶<\/span><span class=\"video-embed-label\">Přehrát video na YouTube<\/span><\/a><\/p><p><span style=\"font-weight: bold\">Nová generace Canvy založená na konverzačním (chatovém) ovládání a „agentní“ AI, která za vás skládá celý proces od nápadu až po hotové návrhy.<\/span><\/p><ul><li><p><strong>Konverzační design: <\/strong>z prostého textu vytvoří hotový design nebo sadu výstupů (např. prezentace, pracovní listy, plakáty, testy, dokumenty...).<\/p><\/li><li><p><strong>Objektová / vrstvená inteligence: <\/strong>výstup není plochý obrázek, ale vrstvy – lze měnit jednotlivé prvky (obrázek, text, font) bez regenerace celku.<\/p><\/li><li><p><strong>Umožňuje skutečnou diferenciaci a personalizaci<\/strong> <strong>návrhů<\/strong> – z jednoho tématu (např. fotosyntéza, zlomky, historie) rychle vytvoří varianty pro různé úrovně žáků, případně aktivity pro žáky a podpůrné materiály pro rodiče.<\/p><\/li><\/ul><p><em style=\"color: rgb(47, 99, 235)\">Canva AI 2.0 už byla spuštěna, ale zatím jako research preview od 16. 4. 2026 pro omezený počet uživatelů.<\/em><\/p>",

    "title": "Manuál pro učitele: jak chytře zadávat prompty AI",
    "tags": [
      "AI"
    ],
    "excerpt": "Umělá inteligence už dnes umí učitelům šetřit čas i energii – ale jen pokud se jí dobře „zeptáme“.  Tento článek nabízí praktické desatero, jak formulovat zadání pro AI chatboty tak, aby výstupy byly přesné, smysluplné pro výuku a co nejméně „halucinovaly“.",
    "content": "<h2>1. Vždy zadejte roli a kontext<\/h2><p>Na začátku promptu uveďte, kdo jste, co připravujete a pro koho je výstup určen. AI pak lépe rozumí situaci a vytváří použitelnější odpověď pro konkrétní třídu, předmět nebo typ školy.<\/p><p><strong>Příklad:<\/strong><\/p><p><span style=\"font-style: italic; background-color: rgb(229, 231, 235)\">Jsi zkušený učitel přírodopisu na 2. stupni ZŠ. Pomáháš mi připravit pracovní list o ekosystému rybníka pro 6. ročník. Ve třídě jsou žáci s rozdílnou úrovní čtenářských dovedností.<\/span><\/p><h2>2. Jasně určete cíl výstupu<\/h2><p>Je dobré AI přesně říct, co má vytvořit: přípravu na hodinu, test, pracovní list, e-mail rodičům nebo osnovu prezentace. Čím konkrétnější cíl, tím menší riziko obecného a těžko použitelného výsledku.<\/p><p><strong>Příklad:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Vytvoř deset otázek k opakování učiva o husitství pro 7. třídu. Polovina otázek má být uzavřená, polovina otevřená.<\/span><\/p><h2>3. Postupujte po krocích<\/h2><p>Místo jednoho dlouhého zadání funguje lépe práce v několika navazujících krocích. Nejprve lze nechat navrhnout cíle, potom strukturu a až nakonec hotový materiál.<\/p><p><strong>Doporučený postup:<\/strong><\/p><ol><li><span style=\"font-style: italic\">Navrhni cíle hodiny.<\/span><\/li><li><span style=\"font-style: italic\">Nabídni tři možné struktury výuky.<\/span><\/li><li><span style=\"font-style: italic\">Rozpracuj vybranou variantu do detailu.<\/span><\/li><\/ol><h2>4. U faktů chtějte ověření<\/h2><p>Když potřebujete věcně správné informace, je vhodné výslovně požádat o ověřitelné zdroje a přiznání nejistoty. To snižuje riziko halucinací, tedy smyšlených nebo nepřesných tvrzení.<\/p><p><strong>Užitečná formulace:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Používej jen ověřitelné informace. Pokud si nejsi jistý nebo nemáš spolehlivý zdroj, napiš NEVÍM.<\/span><\/p><h2>5. Ukažte požadovaný styl<\/h2><p>AI lépe napodobí tón a úroveň jazyka, když dostane krátký příklad. To je užitečné při tvorbě textů pro žáky, rodiče i kolegy.<\/p><p><strong>Příklad zadání:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Napiš oznámení rodičům v podobném stylu jako tento text: ...<\/span><\/p><h2>6. Pište zadání přehledně<\/h2><p>Článek doporučuje používat strukturované zadání, například pomocí nadpisů, seznamů a oddělených částí promptu. Přehledná struktura snižuje nejednoznačnost a pomáhá AI rozlišit vstupy, požadavky i výstupní formát.<\/p><p><strong>Doporučená osnova promptu:<\/strong><\/p><ul><li><span style=\"font-style: italic\">Role AI<\/span><\/li><li><span style=\"font-style: italic\">Kontext výuky<\/span><\/li><li><span style=\"font-style: italic\">Cílová skupina<\/span><\/li><li><span style=\"font-style: italic\">Konkrétní úkol<\/span><\/li><li><span style=\"font-style: italic\">Rozsah výstupu<\/span><\/li><li><span style=\"font-style: italic\">Omezení a podmínky<\/span><\/li><\/ul><h2>7. Myslete na cílovou skupinu<\/h2><p>Prompt by měl vždy obsahovat informaci, komu je výstup určen. Jinak AI často vytvoří příliš obecný text, který neodpovídá věku žáků ani jejich úrovni.<\/p><p><strong>Příklad:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Vysvětli pojem algoritmus žákům 5. třídy jednoduchým jazykem a s příklady ze školy.<\/span><\/p><h2>8. Porovnávejte více variant<\/h2><p>U důležitých výstupů je užitečné chtít více verzí odpovědi a porovnat je. Článek také zmiňuje, že u klíčových textů může pomoci ověření ve více AI nástrojích.<\/p><p><strong>Příklad:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Navrhni tři varianty úvodu do hodiny: motivační, badatelskou a diskusní.<\/span><\/p><h2>9. Řekněte i to, co nechcete<\/h2><p>Dobré zadání obsahuje nejen požadavky, ale i omezení. U školních materiálů je vhodné vymezit například styl, délku, nevhodná témata nebo zákaz osobních údajů.<\/p><p><strong>Příklad:<\/strong><\/p><p><span style=\"background-color: rgb(241, 242, 244); font-style: italic\">Nepoužívej příliš odborný jazyk, anglicismy ani příklady, které nejsou vhodné pro školní prostředí.<\/span><\/p><h2>10. Výstup vždy zkontrolujte<\/h2><p>Ani dobře napsaný prompt nezaručí bezchybný výsledek, proto je nutná učitelská kontrola. Zvlášť u odborných, citlivých nebo hodnoticích textů je vhodné brát AI jako pomocníka, ne jako finální autoritu.<\/p><h2>Šablona univerzálního promptu<\/h2><ul><li><span style=\"font-style: italic\">Jsi [role AI].<\/span><\/li><li><span style=\"font-style: italic\">Pomáháš mi jako učiteli [předmět, ročník] připravit [typ výstupu].<\/span><\/li><li><span style=\"font-style: italic\">Cíl: [co mají žáci na konci umět nebo pochopit].<\/span><\/li><li><span style=\"font-style: italic\">Cílová skupina: [věk, úroveň, specifické potřeby].<\/span><\/li><li><span style=\"font-style: italic\">Úkol: [co přesně má AI vytvořit].<\/span><\/li><li><span style=\"font-style: italic\">Rozsah: [např. 10 otázek, 1 pracovní list, 15min aktivita].<\/span><\/li><li><span style=\"font-style: italic\">Omezení: [co nechci, čemu se vyhnout, jaký jazyk použít].<\/span><\/li><li><span style=\"font-style: italic\">Pokud si nejsi jistý a nemáš ověřitelný zdroj, napiš NEVÍM.`<\/span><\/li><\/ul><h2>Využití ve škole<\/h2><p>Tento přístup lze použít při přípravě hodin, tvorbě pracovních listů, diferenciaci výuky, komunikaci s rodiči i plánování školení pro pedagogy. Největší přínos má tam, kde učitel potřebuje rychle vytvořit návrh, který pak odborně upraví podle vlastní pedagogické zkušenosti.<\/p><p>Zpracováno na základě: <a href=\"https://www.wired.cz/clanky/promptujte-jako-profik-aneb-desatero-spravneho-promptovani-ai\" target=\"_blank\" rel=\"noopener\">https://www.wired.cz/clanky/promptujte-jako-profik-aneb-desatero-spravneho-promptovani-ai<\/a><\/p>",

ong>Každý velký technologický trend projde cyklem fascinace, zahlcení a následné únavy<\/strong> – a to přesně zažíváme u AI. Ve chvíli, kdy se slibuje revoluce všeho a zázračné řešení problémů, tlak na učitele i žáky je obrovský a zákonitě přichází frustrace, když se ukáže, že realita je složitější.<\/p><p>Důležité je se školám a učitelům otevřeně přiznat, že <strong>AI není všemocná<\/strong> a že je naprosto v pořádku, když se cítí zahlcení nebo unavení z nekonečného proudu nových nástrojů. <strong>Nejde o selhání učitelů – jde o normální fázi vývoje technologie i systému.<\/strong><\/p><h2>Prepálená očekávání a učitelé<\/h2><p>Hype kolem AI – všude sliby, že AI rychle zefektivní práci, vyřeší kreativitu, ušetří čas a možná i nahradí část lidské práce. <strong>Když s tímto narativem přicházíme do škol, je téměř jisté, že narazíme na limity: chybovost, potřebu učit se nástroje, etiku, GDPR a čas, který učitelé ve skutečnosti nemají.<\/strong><\/p><ul><li><strong>Učitelé, kteří čekali zázračného asistenta, zažívají zklamání, když zjistí, že AI potřebuje zadání, kontrolu, korekci a dostatek času na naučení.<\/strong><\/li><li><strong>ICT metodici se ocitají v tlaku mezi musíme být moderní a učitelé nestíhají.<\/strong><\/li><li>Mnoho učitelů už má plné zuby toho, že je každé dva měsíce někdo přesvědčuje o další nutné platformě, funkci nebo nástroji.<\/li><\/ul><h2>\"AI fatigue\" ve školách<\/h2><p>AI fatigue je stav, kdy se původní nadšení mění v apatii, podráždění nebo rezignaci. Lidé jsou unavení z neustálého tlaku dělat vše chytřeji pomocí AI, zatímco mají reálné obavy o svou práci, soukromí a tempo změn.<\/p><p>Ve škole se to typicky projevuje takto:<\/p><ul><li><strong>Učitelé mají pocit, že zaostávají<\/strong>, pokud AI nepoužívají, a to zvyšuje stres místo podpory.<\/li><li>Žáci \"skáčou\" mezi novými aplikacemi a méně času věnují hlubšímu učení; <strong>AI někdy funguje spíš jako rozptýlení než jako podpora.<\/strong><\/li><li>Vedení škol cítí povinnost digitalizovat, ale naráží na nedostatek času, kapacit, peněz i jasné metodické opory.<\/li><\/ul><blockquote><span style=\"font-style: normal; color: rgb(20, 23, 26)\"><strong>Rozvoj AI je tak rychlý, že regulace i vzdělávací systémy ho objektivně nestíhají<\/strong>. Nemá smysl honit každý nový nástroj – daleko důležitější je učit principy, kritické myšlení, práci se zadáním, reflexi výstupů AI a didaktické scénáře.<\/span><\/blockquote><h2>Co s tím v praxi škol?<\/h2><ul><li>Pomáhat učitelům orientovat se v marketingovém hype – <strong>společně rozlišovat, co je realistické, co je experiment a co je čistý marketing.<\/strong><\/li><li><strong>Normalizovat únavu z AI<\/strong> – otevřeně říkat, že cítit odpor či únavu je normální reakce, ne důkaz digitální neschopnosti.<\/li><li><strong>Držet didaktický rámec<\/strong> – připomínat, že AI je jen nástroj; jádrem je učební cíl, hodnocení, vztah učitel–žák, bezpečné prostředí.<\/li><li><strong>Rozvíjet reflexi<\/strong> – učit učitele i žáky mluvit o limitech AI (bias, chyby, etika, dopady na práci) a tím snižovat frustraci ze slibů, které se nenaplní.<\/li><li><strong>Nastavovat realistická očekávání<\/strong> – místo slibu revoluce pracovat s konkrétními drobnými zlepšeními: jak si AI může vzít 20–30 minut přípravy týdně, ne celý vyučovací proces.<\/li><li><strong>Budovat podporu, ne tlak<\/strong> – nabízet konzultace, mentoring, komunitní sdílení, ne jen jednorázové povinné školení.<\/li><\/ul><p>Zpracováno na základě: <a href=\"https://www.wired.cz/clanky/prepalena-ocekavani-nas-dohnala-prichazi-masivni-unava-z-umele-inteligence\" target=\"_blank\" rel=\"noopener\">Přepálená očekávání nás dohnala. Přichází masivní únava z umělé inteligence<\/a> – WIRED.cz<\/p>",

  {
    "title": "Jak by se měly děti učit s AI | Priya Lakhani | TED",
    "tags": [
      "AI",
      "Výuka",
      "Přednáška",
      "Myšlenky"
    ],
    "excerpt": "TED talk představuje, jak by AI měla podporovat hluboké učení dětí (a dospělých) místo toho, aby jen nabízela rychlé odpovědi, a vysvětluje, proč je \"mentální námaha\" klíčová pro trvalé porozumění.",
    "content": "<h2><a class=\"video-embed video-embed-fallback\" href=\"https://www.youtube.com/watch?v=YBH8rQv4aTQ\" target=\"_blank\" rel=\"noopener\"><span class=\"video-play-icon\">▶<\/span><span class=\"video-embed-label\">Přehrát video na YouTube<\/span><\/a><\/h2><p><\/p><p><span style=\"font-weight: bold\">TED talk představuje, jak by AI měla podporovat hluboké učení dětí (a dospělých) místo toho, aby jen nabízela rychlé odpovědi, a vysvětluje, proč je \"mentální námaha\" klíčová pro trvalé porozumění.<\/span><\/p><p><\/p><h2><span>Proč současné vzdělávání selhává<\/span><\/h2><p>Priya Lakhani začíná tím, že zjistila, jak závažné jsou problémy i v bohatých systémech – v UK odchází asi 20% žáků ze střední školy bez dostatečných dovedností v čtení a psaní, přestože mají školy i kvalifikované učitele. Učitelé jsou přetížení: 74% z nich chce do tří let odejít zejména kvůli zátěži spojené s hodnocením a sledováním pokroku každého žáka – „učí ve dne, v noci jsou datoví analytici\".<\/p><h2>Co může AI ve třídě dělat<\/h2><p>Místo \"one-size-fits-all\" výuky navrhuje adaptivní systémy, které kombinují umělou inteligenci s neurovědami a didaktikou, aby pochopily, jak se učí každý jednotlivý žák. Její tým vyvinul platformu, kterou používají žáci ve více než 140 zemích a která na základě desítek miliard datových bodů dokáže personalizovat obsah a dávat učitelům srozumitelné, cílené přehledy o učení.<\/p><h2>Jak děti AI skutečně používají<\/h2><p>Z uživatelské zpětné vazby ukazuje dva póly: někteří žáci AI chválí jako pomoc, která jim umožňuje dosáhnout dříve \"nemožného\", jiní ji nenávidí, protože je nutí dělat úkoly, a dokonce ji prosí o \"tlačítko na udělání práce za ně\". To odpovídá průzkumům, podle nichž přibližně pětina dětí přiznává, že používá generativní AI k tomu, aby udělala úkol úplně za ně - tedy k aktivnímu vyhýbání se učení.<\/p><h2>Iluze kompetence a \"zkratky\"<\/h2><p>Při prvním použití nástrojů jako ChatGPT mají lidé pocit euforie a dojmu, že už nikdy nebudou muset \"opravdu pracovat\". Když se ale setkají s halucinacemi systému a chybami v praxi (například citovaný případ právníka v soudní síni), dochází k vystřízlivění a uvědomění, že krátké cesty nenahrazují vlastní myšlení - jen ho doplňují.<\/p><h2>Co víme o efektivním učení<\/h2><p>Lakhani shrnuje výzkum do čtyř technik, které mají společné to, že jsou náročnější a vyžadují \"produktivní zápas\":<\/p><ul><li><span>Retrieval: aktivní vybavování z paměti, kdy žáci, kteří text jednou přečtou a pak se ho snaží vybavit, dosahují lepších výsledků než ti, kteří jen znovu a znovu čtou.<\/span><\/li><li><span>Spacing: rozložení učení v čase, kdy se opakovaně vracejí k látce a znovu si ji vybavují, místo jednorázového \"nacpání\" před testem.<\/span><\/li><li><span>Generation: vytváření odpovědí (například doplňování druhého slova z nápovědy písmena), které vede k silnějším paměťovým stopám, i když jsou odpovědi zpočátku chybné.<\/span><\/li><li><span>Reflection: strukturované přemýšlení o vlastním učení pod vedením tří otázek - jak se učím teď, jaký je můj cíl a jaké mezery musím překlenout - což prokazatelně zlepšuje výsledky.<\/span><\/li><\/ul><h2>Proč námaha mění mozek<\/h2><p><strong>Argumentuje, že paměť a porozumění jsou dvě strany jedné mince: bez vybavení informací je nelze použít k myšlení.<\/strong> Jako ilustraci uvádí výzkum londýnských taxikářů, kteří kvůli zkoušce \"The Knowledge\" musí znát přibližně 26 000 ulic a u nichž byly nalezeny zvětšené části hippocampu spojené s prostorovou pamětí a navigací.<\/p><h2>Jak má AI podporovat učení<\/h2><p>Dobře navržená AI podle ní:<\/p><ul><li>rozpozná vzorce v tom, jak se učíme, a dokáže v pravý čas nabídnout vhodný obsah,<\/li><li>odhadne, kdy něco zapomínáme, a znovu to zařadí do učení,<\/li><li>donutí žáka generovat odpověď místo odhalení řešení,<\/li><li>poskytne bohatou, strukturovanou zpětnou vazbu podle kvalitních rubrik učitelů.<\/li><\/ul><p>Taková AI tím snižuje učitelskou zátěž a zároveň posiluje hluboké učení, ne jen klikání na správné odpovědi.<\/p><h2>Role lidí v éře AI<\/h2><p>AI je podle Lakhani \"naše minulost předpovídající naši budoucnost\" - skvělá v rozpoznávání vzorců, ale ne v určování, na čem záleží. Lidé stále musejí klást otázky, volit cíle, vybírat datové sady a rozhodovat, které objevy jsou důležité; znalosti tedy nejsou jen \"trivia\", ale surovina pro myšlení a inovace.<\/p><h2>Závěrečné poselství<\/h2><p>Trvalé učení nevzniká zkraty, ale díky určitému druhu úsilí, které buduje odbornost a umožňuje \"skoky představivosti\" - od létání přes penicilin až po samotnou AI. <strong>Dopad AI na vzdělávání proto závisí na tom, jak je navržena a jak ji používáme: buď jako doplněk lidského myšlení a nástroje pro produktivní zápas, nebo jako náhradu kognice, která nás o tento růst připraví.<\/strong><\/p><p><strong>Zdroje<\/strong> [1] This Is How Kids Should Be Learning with AI | Priya Lakhani | TED <a href=\"https://youtube.com/watch?v=YBH8rQv4aTQ&amp;pp=4gcMEgpwZXJwbGV4aXR5\" target=\"_blank\" rel=\"noopener\">https://youtube.com/watch?v=YBH8rQv4aTQ&amp;pp=4gcMEgpwZXJwbGV4aXR5<\/a><\/p><h2>Několik praktických zásad jak se učit s AI ve škole<\/h2><h2>1. Cíl: podpora námahy, ne zkratek<\/h2><p>Nastavte AI ve škole tak, aby žáky vedla k přemýšlení (vysvětlení, zdůvodnění, tvorba řešení), ne jen k generování hotových odpovědí.<\/p><p>Otevřeně s žáky mluvte o tom, že učení má být lehce náročné - \"produktivní zápas\" je normální a žádoucí součást učení.<\/p><h2>2. Využívejte čtyři \"tvrdé\" strategie učení<\/h2><p>Začleňujte do práce s AI ověřeně efektivní techniky:<\/p><p><strong>Retrieval<\/strong>: Žádejte po žácích, aby si informace nejdřív vybavili sami (např. otázky, shrnutí z hlavy) a teprve pak použili AI k doplnění nebo kontrole.<\/p><p><strong>Spacing<\/strong>: Plánujte návraty k látce v čase; AI může připomínat starší témata a klást otázky z dřívějších bloků.<\/p><p><strong>Generation<\/strong>: Zadávejte úkoly, kdy žáci musí sami něco vytvořit (hypotézu, příklad, řešení), a AI využijí až následně k porovnání nebo rozšíření.<\/p><p><strong>Reflection<\/strong>: Vytvářejte s AI krátké \"reflektivní dotazníky\" - jak ses učil, co ti šlo, co ne, co zkusíš příště jinak.<\/p><h2>3. AI jako osobní tutor, učitel jako architekt<\/h2><p>Nechte AI dělat to, co učitelům bere čas: adaptivní procvičování, diagnostické otázky, návrhy individualizovaných úloh, základní vysvětlování pro různé úrovně.<\/p><p>Učitel si drží roli architekta učení: volí cíle, kritéria úspěchu, hodnoticí rubriky a situace, v nichž AI smí (a nesmí) žákům pomáhat.<\/p><h2>4. Práce s daty a přehledy pro učitele<\/h2><p>Využijte AI systémy, které učitelům poskytují srozumitelné přehledy o dovednostech a slabinách žáků (nejen \"procenta správně\"), aby mohli cíleně zasahovat tam, kde je potřeba.<\/p><p>Zaměřte se na nástroje, které umí sledovat pokrok dlouhodobě a upozornit, kdy žák danou látku zapomíná a potřebuje návrat či jiné vysvětlení.<\/p><h2>5. Nastavení pravidel pro \"cheating vs. učení\"<\/h2><p>Společně s žáky definujte, kdy je použití generativní AI ještě učení (podpora, nápověda, druhé vysvětlení) a kdy už nahrazování vlastní práce.<\/p><p>Učte žáky aktivnímu používání AI: ptát se, zpochybňovat odpovědi, zjišťovat zdroje, hledat chyby - ne slepě kopírovat.<\/p><h2>6. Učení s chybami AI<\/h2><p>Pracujte didakticky s tím, že AI se mýlí (halucinace): nechte žáky ověřovat tvrzení, hledat proti-příklady, porovnávat s jinými zdroji.<\/p><p>Ukazujte tím, že kritické myšlení a znalosti jsou nutnou výbavou i v době, kdy má \"každý v kapse superinteligentní kalkulačku na text\".<\/p><h2>7. Budování znalostí, ne jen \"trivií\"<\/h2><p><strong>Zdůrazňujte, že znalosti jsou předpoklad pro myšlení: žák potřebuje dost faktů v hlavě, aby s nimi mohl tvořit nové nápady a chápat souvislosti.<\/strong><\/p><p>Při práci s AI proto míříte nejen na \"správné odpovědi\", ale na hlubší porozumění - propojení s dřívější látkou, vysvětlení proč a jak.<\/p><h2>8. Etika, role člověka a \"co stroje neumí\"<\/h2><p>Se žáky probírejte, že AI umí rozpoznávat vzorce z minulosti, ale neumí rozhodnout, na čem záleží, co je spravedlivé, které cíle sledovat.<\/p><p>Dejte prostor diskusím o tom, kde mají rozhodovat lidé, jaké otázky by měli pokládat, jak vybírat data a jaké dopady má návrh systémů na společnost.<\/p><h2>9. Snižování zátěže učitele, zvyšování kvality výuky<\/h2><p>Cílem implementace AI má být ubírání rutinní práce učitelům (opravy, evidence, jednoduché procvičování) a uvolnění kapacity pro práci s lidmi \"tváří v tvář\".<\/p><p>Snažte se AI integrovat tak, aby podporovala profesní autonomii a expertízu učitele, ne aby ho \"nahrazovala skriptem\".<\/p><p>Zdroje [1] This Is How Kids Should Be Learning with AI | Priya Lakhani | TED <a href=\"https://youtube.com/watch?v=YBH8rQv4aTQ&amp;pp=4gcMEgpwZXJwbGV4aXR5\" target=\"_blank\" rel=\"noopener\">https://youtube.com/watch?v=YBH8rQv4aTQ&amp;pp=4gcMEgpwZXJwbGV4aXR5<\/a><\/p>",

      doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    } catch (e) { return ''; }
    var root = doc.body.firstChild;
    if (!root) return '';
    (function walk(node) {
      var child = node.firstChild;
      while (child) {
        var next = child.nextSibling;
        if (child.nodeType === 1) {
          var tag = child.tagName;
          if (!ALLOWED_TAGS[tag]) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);

            child = next;
            continue;
          }
          Array.prototype.slice.call(child.attributes).forEach(function (attr) {
            var name = attr.name.toLowerCase();
            if (tag === 'A' && name === 'href') {

            } else if (tag === 'IMG' && name === 'src') {
              if (!/^(https?:|data:image\/)/i.test(attr.value.trim())) child.removeAttribute(attr.name);
            } else if (tag === 'IMG' && name === 'alt') {
              // keep
            } else if (tag === 'IMG' && name === 'class') {
              if (attr.value.trim() !== 'video-embed-thumb') child.removeAttribute(attr.name);
            } else if (tag === 'A' && name === 'class') {
              if (!/^video-embed( video-embed-fallback)?$/.test(attr.value.trim())) child.removeAttribute(attr.name);
            } else if (tag === 'SPAN' && name === 'class') {
              if (!/^(video-play-icon|video-embed-label)$/.test(attr.value.trim())) child.removeAttribute(attr.name);
            } else if (name === 'style') {
              var cleanedStyle = sanitizeStyleAttr(attr.value);

        }

  function stripTags(html) {
    return (html || '').replace(/<[^>]+>/g, ' ');
  }

  function makeExcerpt(html) {
    var plain = stripTags(html).replace(/\s+/g, ' ').trim();
    return plain.length > 160 ? plain.slice(0, 160).trim() + '…' : plain;
  }

  function formatDate(ts) {
    try {
      return new Date(ts).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return ''; }
  }

  function toDateInput(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) d = new Date();
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  function readMinutes(html) {
    var words = stripTags(html).trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 200));
  }

  function formatMeta(post) {
    return formatDate(post.createdAt) + '  •  ' + readMinutes(post.content) + ' min čtení';
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(function () { els.toast.classList.remove('show'); }, 2600);
  }

  function parseTags(str) {
    return (str || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
  }

  function genId() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- data ----------

  function loadInitialPosts() {
    var el = document.getElementById('posts-data');
    if (!el) return [];
    try {
      var raw = el.textContent.split('<\\/').join('</');
      var parsed = JSON.parse(raw || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function buildDocument(posts) {
    var dataJson = JSON.stringify(posts, null, 2).split('</').join('<\\/');
    return '<!doctype html><html><head>' + HEAD_HTML + '</head><body>' + BODY_SHELL_HTML +
      '<script id="posts-data" type="application/json">' + dataJson + '<\/script>' +
      '<script>' + SELF_SCRIPT_SOURCE + '<\/script>' +
      '</body></html>';
  }

  function publishState(newPosts) {
    if (!state.artifactCap) {
      return Promise.reject({ code: 'not_granted' });
    }
    var html = buildDocument(newPosts);
    return state.artifactCap.publish(html).then(function (result) {
      state.posts = newPosts;
      renderAll();
      return result;
    });
  }

  function publishErrorMessage(err) {
    var code = err && err.code;
    if (code === 'not_writer' || code === 'not_granted') return 'Nemáš oprávnění tuto stránku upravovat.';
    if (code === 'conflict') return 'Stránka byla mezitím změněna — načítám aktuální verzi.';
    if (code === 'too_large') return 'Obsah je příliš velký na publikování.';
    return 'Publikování se nezdařilo, zkus to prosím znovu.';
  }

  function persistNew(post) {
    return publishState([post].concat(state.posts));
  }

  function persistUpdate(id, patch) {
    var newPosts = state.posts.map(function (p) { return p.id === id ? Object.assign({}, p, patch) : p; });
    return publishState(newPosts);
  }

  function persistDelete(id) {
    var newPosts = state.posts.filter(function (p) { return p.id !== id; });
    return publishState(newPosts);
  }

  // ---------- capabilities ----------

  function applyAdminUI() {
    els.newBtn.hidden = !state.isAdmin;
    renderAll();
    routeFromHash();
  }

  function initCapabilities() {
    if (!(window.claude && window.claude.use)) { applyAdminUI(); return; }
    window.claude.use('artifact').then(function (cap) {
      state.artifactCap = cap;
      return window.claude.use('user');
    }).then(function (user) {
      return user ? user.isOwner() : false;
    }).then(function (isOwner) {
      state.isAdmin = !!isOwner;
      applyAdminUI();
    }).catch(function () {
      state.isAdmin = false;
      applyAdminUI();
    });
  }

  // ---------- rendering: list ----------

  function visiblePosts() {
    return state.isAdmin ? state.posts : state.posts.filter(function (p) { return p.status !== 'draft'; });
  }

  function allTags() {
    var set = {};
    visiblePosts().forEach(function (p) { (p.tags || []).forEach(function (t) { set[t] = true; }); });
    return Object.keys(set).sort();
  }

  function filteredPosts() {
    var q = state.search.trim().toLowerCase();
    return visiblePosts().slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }).filter(function (p) {
      if (!state.filterTags.every(function (t) { return (p.tags || []).indexOf(t) !== -1; })) return false;
      if (!q) return true;
      var hay = (p.title + ' ' + (p.excerpt || '') + ' ' + stripTags(p.content || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function renderTags() {
    els.tagsRow.innerHTML = '';
    var known = allTags();
    state.filterTags = state.filterTags.filter(function (t) { return known.indexOf(t) !== -1; });
    var allChip = document.createElement('button');
    allChip.className = 'chip' + (state.filterTags.length === 0 ? ' active' : '');
    allChip.textContent = 'Vše';
    allChip.onclick = function () { state.filterTags = []; state.page = 1; renderAll(); };
    els.tagsRow.appendChild(allChip);

    allTags().forEach(function (tag) {
      var chip = document.createElement('button');
      chip.className = 'chip' + (state.filterTags.indexOf(tag) !== -1 ? ' active' : '');
      chip.textContent = tag;
      chip.setAttribute('aria-pressed', state.filterTags.indexOf(tag) !== -1 ? 'true' : 'false');
      chip.onclick = function () {
        var i = state.filterTags.indexOf(tag);
        if (i === -1) state.filterTags = state.filterTags.concat(tag);
        else state.filterTags = state.filterTags.filter(function (t) { return t !== tag; });
        state.page = 1;
        renderAll();
      };
      els.tagsRow.appendChild(chip);
    });
  }

  function renderPager(totalPages) {
    els.pager.innerHTML = '';
    els.pager.hidden = totalPages <= 1;
    if (totalPages <= 1) return;
    function btn(label, page, opts) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      opts = opts || {};
      if (opts.active) { b.className = 'active'; b.setAttribute('aria-current', 'page'); }
      if (opts.disabled) b.disabled = true;
      if (opts.label) b.setAttribute('aria-label', opts.label);
      b.onclick = function () {
        state.page = page;
        renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      els.pager.appendChild(b);
    }
    btn('←', state.page - 1, { disabled: state.page <= 1, label: 'Předchozí stránka' });
    for (var i = 1; i <= totalPages; i++) btn(String(i), i, { active: i === state.page, label: 'Stránka ' + i });
    btn('→', state.page + 1, { disabled: state.page >= totalPages, label: 'Další stránka' });
  }

  function renderList() {
    var posts = filteredPosts();
    var totalPages = Math.max(1, Math.ceil(posts.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    if (state.page < 1) state.page = 1;
    var pagePosts = posts.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
    renderPager(totalPages);
    var totalVisible = visiblePosts().length;
    els.list.innerHTML = '';
    if (totalVisible > 0 && posts.length === 0) {
      els.empty.hidden = false;
      els.empty.querySelector('h2').textContent = 'Nic nenalezeno';
      els.empty.querySelector('p').textContent = 'Zkus jiné hledání nebo odeber některý ze štítků.';
    } else if (totalVisible === 0) {
      els.empty.hidden = false;
      els.empty.querySelector('h2').textContent = 'Zatím žádné články';
      els.empty.querySelector('p').textContent = 'Založ první příspěvek tlačítkem „Nový článek“ nahoře.';
    } else {
      els.empty.hidden = true;
    }
    pagePosts.forEach(function (p) {
      var item = document.createElement('button');
      item.className = 'post-item';
      item.innerHTML =
        '<div class="post-head"><div class="post-head-text">' +
          '<div class="post-title">' + escapeHtml(p.title) + '</div>' +
          '<div class="post-meta">' + (p.status === 'draft' ? '<span class="draft-badge">Koncept</span>' : '') + formatMeta(p) + '</div>' +
        '</div></div>' +
        '<div class="post-excerpt">' + escapeHtml(p.excerpt || makeExcerpt(p.content)) + '</div>' +
        '<div class="tag-row">' + (p.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>';
      item.onclick = function () { navigateToPost(p.id); };
      els.list.appendChild(item);
    });
  }

  function renderAll() {
    renderTags();
    renderList();
  }

  // ---------- routing (list page vs. article page) ----------

  function showListView() {
    els.shell.classList.remove('compact');
    els.listView.hidden = false;
    els.postView.hidden = true;
  }

  function showPostViewFor(post) {
    els.shell.classList.add('compact');
    els.listView.hidden = true;
    els.postView.hidden = false;
    renderPostPage(post);
    window.scrollTo(0, 0);
  }

  function routeFromHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    var post = raw ? visiblePosts().find(function (p) { return p.id === raw; }) : null;
    if (post) showPostViewFor(post); else showListView();
  }

  function navigateToPost(id) {
    closeOverlay();
    if (location.hash.replace(/^#/, '') === id) routeFromHash();
    else location.hash = id;
  }

  function navigateToList() {
    closeOverlay();
    if (!location.hash || location.hash === '#') routeFromHash();
    else location.hash = '';
  }

  window.addEventListener('hashchange', routeFromHash);

  function goHome() {
    state.filterTags = [];
    state.search = '';
    state.page = 1;
    els.search.value = '';
    renderAll();
    navigateToList();
  }

  function enhanceVideos(container) {
    Array.prototype.forEach.call(container.querySelectorAll('a.video-embed'), function (a) {
      var m = (a.getAttribute('href') || '').match(/[?&]v=([A-Za-z0-9_-]{11})/);

      var vid = m[1];
      var box = document.createElement('div');
      box.className = 'video-embed-player';
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + vid + '?rel=0';

      f.loading = 'lazy';
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.setAttribute('allowfullscreen', '');
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.appendChild(f);
      a.parentNode.replaceChild(box, a);
    });
  }

  function renderPostPage(post) {
    els.postView.innerHTML =
      '<div class="post-toprow">' +
        '<button class="btn btn-ghost" id="post-back-btn">← Zpět na výpis</button>' +
        (state.isAdmin ? '<div class="row">' +
          '<button class="btn btn-ghost" id="post-edit-btn">Upravit</button>' +
          '<button class="btn btn-danger" id="post-del-btn">Smazat</button>' +
        '</div>' : '') +
      '</div>' +
      '<div class="article-date">' + (post.status === 'draft' ? '<span class="draft-badge">Koncept</span>' : '') + formatMeta(post) + (post.updatedAt && post.updatedAt !== post.createdAt ? '  •  upraveno ' + formatDate(post.updatedAt) : '') + '</div>' +
      '<h1 class="article-title">' + escapeHtml(post.title) + '</h1>' +
      '<div class="article-tags">' + (post.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
      '<div class="article-body">' + sanitizeHtml(post.content) + '</div>' +

    if (!state.isAdmin) return;
    document.getElementById('post-edit-btn').onclick = function () { openEditor(post); };
    document.getElementById('post-del-btn').onclick = function () {
      var slot = document.getElementById('post-confirm-slot');
      slot.innerHTML =
        '<div class="confirm-box">' +
          '<span>Smazat článek „' + escapeHtml(post.title) + '“? Tuto akci nelze vrátit.</span>' +
          '<div class="row"><button class="btn btn-ghost" id="post-cancel-del">Zrušit</button><button class="btn btn-danger" id="post-confirm-del">Smazat trvale</button></div>' +
        '</div>';
      document.getElementById('post-cancel-del').onclick = function () { slot.innerHTML = ''; };
      document.getElementById('post-confirm-del').onclick = function () {
        var btn = document.getElementById('post-confirm-del');
        btn.disabled = true;
        btn.textContent = 'Mažu…';

          showToast('Článek smazán a publikován.');

    };
  }

  function readAndResizeImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read_failed')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('decode_failed')); };
        img.onload = function () {
          var maxDim = 1280;
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var outW = Math.max(1, Math.round(w * scale));
          var outH = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = outW; canvas.height = outH;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, outW, outH);
          var dataUrl = file.type === 'image/png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.82);
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function markdownToHtml(md) {

      t = t.replace(/\*(?=\S)([^*]*?\S)\*/g, '<em>$1</em>');
      t = t.replace(/(^|[\s(])_(?=\S)([^_]*?\S)_(?=$|[\s).,;:!?])/g, '$1<em>$2</em>');
      return t.replace(/\u0000(\d+)\u0000/g, function (m, k) { return stash[+k]; });
    }
    var RE_FENCE = /^\s*```/, RE_HEAD = /^(#{1,6})\s+(.*?)\s*#*\s*$/, RE_HR = /^\s*([-*_])(\s*\1){2,}\s*$/,
        RE_QUOTE = /^\s*>/, RE_UL = /^\s*[-*+]\s+/, RE_OL = /^\s*\d+[.)]\s+/;
    function startsBlock(l) {
      return RE_FENCE.test(l) || RE_HEAD.test(l) || RE_HR.test(l) || RE_QUOTE.test(l) || RE_UL.test(l) || RE_OL.test(l);
    }
    while (i < n) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      var m;
      if (RE_FENCE.test(line)) {
        var code = [];
        i++;
        while (i < n && !RE_FENCE.test(lines[i])) { code.push(escapeHtml(lines[i])); i++; }
        i++;
        out.push('<p style="background-color: #F1F2F4; padding: 12px 16px; border-radius: 10px">' + code.join('<br>') + '</p>');
      } else if ((m = RE_HEAD.exec(line))) {
        out.push('<' + (m[1].length <= 2 ? 'h2' : 'h3') + '>' + inline(m[2]) + '</' + (m[1].length <= 2 ? 'h2' : 'h3') + '>');
        i++;
      } else if (RE_HR.test(line)) {
        i++;
      } else if (RE_QUOTE.test(line)) {
        var q = [];
        while (i < n && RE_QUOTE.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + inline(q.join(' ').trim()) + '</blockquote>');
      } else if (RE_UL.test(line) || RE_OL.test(line)) {
        var ordered = RE_OL.test(line);
        var re = ordered ? RE_OL : RE_UL;
        var items = [];
        while (i < n) {
          var l = lines[i];
          if (re.test(l)) { items.push(l.replace(re, '')); i++; }
          else if (/^\s*$/.test(l) && i + 1 < n && re.test(lines[i + 1])) { i++; }
          else if (/^\s+\S/.test(l) && items.length && !RE_UL.test(l) && !RE_OL.test(l)) { items[items.length - 1] += ' ' + l.trim(); i++; }
          else if (/^\s+(?:[-*+]|\d+[.)])\s+/.test(l) && items.length) { items.push(l.replace(/^\s+(?:[-*+]|\d+[.)])\s+/, '')); i++; }
          else break;
        }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(function (it) { return '<li>' + inline(it.trim()) + '</li>'; }).join('') + '</' + tag + '>');
      } else {
        var para = [];
        while (i < n && !/^\s*$/.test(lines[i]) && (para.length === 0 || !startsBlock(lines[i]))) { para.push(lines[i].trim()); i++; }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
    }
    return out.join('');
  }

    color: '<path d="M5 21h14"/><path d="M8 16l4-11 4 11M9.5 12.5h5"/>',
    mark: '<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
    box: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    video: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>',
    eraser: '<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
    md: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'
  };
  function ico(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }

  function openEditor(existing) {
    if (!state.isAdmin) return;
    closeOverlay();
    overlayRoot = document.createElement('div');
    overlayRoot.className = 'overlay';
    overlayRoot.innerHTML =
      '<div class="panel">' +
        '<div class="panel-top"><h2 style="font-size:1.3rem">' + (existing ? 'Upravit článek' : 'Nový článek') + '</h2>' +
          '<button class="btn btn-ghost" id="cancel-edit">Zavřít</button></div>' +
        '<div class="field"><label for="f-title">Titulek</label><input id="f-title" type="text" placeholder="Např. AI ve třídě: první zkušenosti" value="' + (existing ? escapeHtml(existing.title) : '') + '"></div>' +
        '<div class="field"><label for="f-tags">Štítky (odděl čárkou)</label><input id="f-tags" type="text" placeholder="Např. AI, LMS, poznámky" value="' + (existing ? escapeHtml((existing.tags || []).join(', ')) : '') + '"></div>' +
        '<div class="field"><label for="f-date">Datum zveřejnění</label><input id="f-date" type="date" value="' + toDateInput(existing ? existing.createdAt : Date.now()) + '"></div>' +
        '<div class="field"><label for="f-excerpt">Perex (nepovinné)</label><textarea id="f-excerpt" rows="3" placeholder="Krátké shrnutí — jinak se vygeneruje samo">' + (existing ? escapeHtml(existing.excerpt || '') : '') + '</textarea></div>' +
        '<div class="field"><label>Text článku</label>' +
          '<div class="editor-sticky">' +
          '<div class="editor-toolbar">' +
            '<button type="button" class="toolbar-btn" data-cmd="bold" title="Tučně"><b>B</b></button>' +
            '<button type="button" class="toolbar-btn" data-cmd="italic" title="Kurzíva"><i>I</i></button>' +
            '<button type="button" class="toolbar-btn" data-cmd="underline" title="Podtržení"><u>U</u></button>' +
            '<span class="toolbar-sep"></span>' +
            '<button type="button" class="toolbar-btn" data-block="H2" title="Nadpis 2">H2</button>' +
            '<button type="button" class="toolbar-btn" data-block="H3" title="Nadpis 3">H3</button>' +
            '<button type="button" class="toolbar-btn" data-block="P" title="Normální text">Text</button>' +
            '<span class="toolbar-sep"></span>' +
            '<button type="button" class="toolbar-btn" data-cmd="insertUnorderedList" title="Odrážky">' + ico('ul') + 'Seznam</button>' +
            '<button type="button" class="toolbar-btn" data-cmd="insertOrderedList" title="Číslovaný seznam">' + ico('ol') + 'Číslovaný</button>' +
            '<button type="button" class="toolbar-btn" data-block="BLOCKQUOTE" title="Citace">' + ico('quote') + 'Citace</button>' +
            '<span class="toolbar-sep"></span>' +
            '<button type="button" class="toolbar-btn" data-cmd="justifyLeft" title="Zarovnat vlevo" aria-label="Zarovnat vlevo">' + ico('left') + '</button>' +
            '<button type="button" class="toolbar-btn" data-cmd="justifyCenter" title="Na střed" aria-label="Na střed">' + ico('center') + '</button>' +
            '<button type="button" class="toolbar-btn" data-cmd="justifyRight" title="Zarovnat vpravo" aria-label="Zarovnat vpravo">' + ico('right') + '</button>' +
            '<span class="toolbar-sep"></span>' +
            '<button type="button" class="toolbar-btn" id="text-color-btn" title="Barva textu">' + ico('color') + 'Barva</button>' +
            '<button type="button" class="toolbar-btn" id="highlight-color-btn" title="Podbarvení textu">' + ico('mark') + 'Zvýraznit</button>' +
            '<button type="button" class="toolbar-btn" id="box-btn" title="Barevný rámeček odstavce">' + ico('box') + 'Rámeček</button>' +
            '<button type="button" class="toolbar-btn" id="clear-fmt-btn" title="Vymazat všechno formátování ve výběru (nebo v odstavci s kurzorem)">' + ico('eraser') + 'Vymazat formát</button>' +
            '<span class="toolbar-sep"></span>' +
            '<button type="button" class="toolbar-btn" id="link-btn" title="Vložit odkaz">' + ico('link') + 'Odkaz</button>' +
            '<button type="button" class="toolbar-btn" id="image-btn" title="Vložit obrázek">' + ico('image') + 'Obrázek</button>' +
            '<button type="button" class="toolbar-btn" id="video-btn" title="Vložit YouTube video">' + ico('video') + 'YouTube</button>' +
            '<button type="button" class="toolbar-btn" id="md-btn" title="Vložit text ve formátu Markdown">' + ico('md') + 'Markdown</button>' +
            '<input type="file" accept="image/*" id="image-file-input" hidden>' +
          '</div>' +
          '<div class="link-popover" id="link-popover" hidden>' +
            '<input type="text" id="link-url-input" placeholder="https://…">' +
            '<button type="button" class="btn btn-ghost" id="link-cancel">Zrušit</button>' +
            '<button type="button" class="btn btn-primary" id="link-apply">Vložit</button>' +
          '</div>' +
          '<div class="link-popover" id="video-popover" hidden>' +
            '<input type="text" id="video-url-input" placeholder="Odkaz na YouTube video…">' +
            '<button type="button" class="btn btn-ghost" id="video-cancel">Zrušit</button>' +
            '<button type="button" class="btn btn-primary" id="video-apply">Vložit</button>' +
          '</div>' +
          '<div class="color-popover" id="text-color-popover" hidden>' + colorSwatchesHtml(TEXT_COLORS, 'text') + '</div>' +
          '<div class="color-popover" id="highlight-color-popover" hidden>' + colorSwatchesHtml(HIGHLIGHT_COLORS, 'highlight') + '</div>' +
          '<div class="link-popover" id="md-popover" hidden>' +
            '<textarea id="md-input" placeholder="Vlož sem text v Markdownu…"></textarea>' +
            '<span class="md-hint">Podporováno: # nadpisy, **tučně**, *kurzíva*, [odkaz](https://…), seznamy, &gt; citace, `kód`. Tabulky a obrázky ne.</span>' +
            '<button type="button" class="btn btn-ghost" id="md-cancel">Zrušit</button>' +
            '<button type="button" class="btn btn-primary" id="md-apply">Vložit do článku</button>' +
          '</div>' +
          '<div class="color-popover" id="box-popover" hidden>' + colorSwatchesHtml(BOX_COLORS, 'box') + '</div>' +
          '</div>' +
          '<div class="rich-editor-wrap">' +
            '<div class="rich-editor" id="f-content" contenteditable="true"></div>' +
            '<span class="rich-editor-placeholder" id="f-content-placeholder">Piš text článku…</span>' +
          '</div>' +
        '</div>' +
        '<div class="row-end">' +
          '<button class="btn btn-ghost" id="draft-btn">Uložit jako koncept</button>' +
          '<button class="btn btn-primary" id="save-btn">' + (existing && existing.status !== 'draft' ? 'Uložit a publikovat' : 'Publikovat') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlayRoot);
    overlayRoot.addEventListener('click', function (e) { if (e.target === overlayRoot) closeOverlay(); });

    var contentEl = document.getElementById('f-content');
    var placeholderEl = document.getElementById('f-content-placeholder');
    var linkPopover = document.getElementById('link-popover');
    var linkUrlInput = document.getElementById('link-url-input');
    var videoPopover = document.getElementById('video-popover');
    var videoUrlInput = document.getElementById('video-url-input');
    var excerptEl = document.getElementById('f-excerpt');
    function growExcerpt() { excerptEl.style.height = 'auto'; excerptEl.style.height = Math.max(76, excerptEl.scrollHeight + 3) + 'px'; }
    excerptEl.addEventListener('input', growExcerpt);
    growExcerpt();
    var mdPopover = document.getElementById('md-popover');
    var mdInput = document.getElementById('md-input');
    var savedRange = null;

    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
    try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
    contentEl.innerHTML = existing ? sanitizeHtml(existing.content) : '';
    markVideoEmbedsNonEditable(contentEl);

    function updatePlaceholder() { placeholderEl.hidden = !isEditorEmpty(contentEl); }
    updatePlaceholder();
    contentEl.addEventListener('input', updatePlaceholder);

    Array.prototype.forEach.call(overlayRoot.querySelectorAll('.toolbar-btn[data-cmd]'), function (btn) {
      btn.onclick = function () {
        contentEl.focus();
        document.execCommand(btn.getAttribute('data-cmd'), false, null);
        updatePlaceholder();
      };
    });
    Array.prototype.forEach.call(overlayRoot.querySelectorAll('.toolbar-btn[data-block]'), function (btn) {
      btn.onclick = function () {
        contentEl.focus();
        document.execCommand('formatBlock', false, btn.getAttribute('data-block'));
        updatePlaceholder();
      };
    });

    document.getElementById('link-btn').onclick = function () {
      var sel = window.getSelection();
      if (!(sel.rangeCount > 0 && contentEl.contains(sel.anchorNode) && !sel.isCollapsed)) {
        showToast('Nejdřív vyber text, který se má stát odkazem.');
        return;
      }
      savedRange = sel.getRangeAt(0).cloneRange();
      linkUrlInput.value = '';
      textColorPopover.hidden = true;
      highlightColorPopover.hidden = true;
      videoPopover.hidden = true;
      boxPopover.hidden = true;
      mdPopover.hidden = true;
      linkPopover.hidden = false;
      linkUrlInput.focus();
    };
    document.getElementById('link-cancel').onclick = function () { linkPopover.hidden = true; };
    document.getElementById('link-apply').onclick = function () {
      var url = linkUrlInput.value.trim();
      if (!/^https?:\/\//i.test(url)) { showToast('Zadej platnou adresu začínající https://'); return; }
      contentEl.focus();
      if (savedRange) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
      document.execCommand('createLink', false, url);
      linkPopover.hidden = true;
    };

    var textColorPopover = document.getElementById('text-color-popover');
    var highlightColorPopover = document.getElementById('highlight-color-popover');
    var boxPopover = document.getElementById('box-popover');
    var savedColorRange = null;

    function hidePopovers() {
      linkPopover.hidden = true;
      textColorPopover.hidden = true;
      highlightColorPopover.hidden = true;
      videoPopover.hidden = true;
      boxPopover.hidden = true;
      mdPopover.hidden = true;
    }

    document.getElementById('text-color-btn').onclick = function () {
      var sel = window.getSelection();
      if (!(sel.rangeCount > 0 && contentEl.contains(sel.anchorNode))) {
        showToast('Nejdřív klikni do textu nebo vyber text.');
        return;
      }
      savedColorRange = sel.getRangeAt(0).cloneRange();
      hidePopovers();
      textColorPopover.hidden = false;
    };
    document.getElementById('highlight-color-btn').onclick = function () {
      var sel = window.getSelection();
      if (!(sel.rangeCount > 0 && contentEl.contains(sel.anchorNode))) {
        showToast('Nejdřív klikni do textu nebo vyber text.');
        return;
      }
      savedColorRange = sel.getRangeAt(0).cloneRange();
      hidePopovers();
      highlightColorPopover.hidden = false;
    };
    document.getElementById('box-btn').onclick = function () {
      var sel = window.getSelection();
      if (!(sel.rangeCount > 0 && contentEl.contains(sel.anchorNode))) {
        showToast('Nejdřív klikni do odstavce.');
        return;
      }
      savedColorRange = sel.getRangeAt(0).cloneRange();
      hidePopovers();
      boxPopover.hidden = false;
    };
    function applyBlockBox(color) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      var range = sel.getRangeAt(0);
      var blocks = [];
      Array.prototype.forEach.call(contentEl.querySelectorAll('p,h1,h2,h3,blockquote,li'), function (el) {
        var hit = false;
        try { hit = range.intersectsNode(el); } catch (e) {}
        if (hit && !range.collapsed && range.endOffset === 0 && el.contains(range.endContainer) && !el.contains(range.startContainer)) hit = false;
        if (hit) blocks.push(el);
      });
      if (!blocks.length) {
        var n = range.startContainer;
        while (n && n !== contentEl && !(n.nodeType === 1 && n.tagName === 'DIV')) n = n.parentNode;
        if (n && n !== contentEl) blocks.push(n);
      }
      if (!blocks.length) { showToast('Klikni do odstavce, který má mít rámeček.'); return; }
      blocks.forEach(function (el) {
        if (color === 'transparent') {
          el.style.border = '';
          el.style.padding = '';
          el.style.borderRadius = '';
          if (!el.getAttribute('style')) el.removeAttribute('style');
        } else {
          el.style.border = '2px solid ' + color;
          el.style.padding = '12px 16px';
          el.style.borderRadius = '10px';
        }
      });
    }
    Array.prototype.forEach.call(overlayRoot.querySelectorAll('.color-swatch'), function (btn) {
      btn.onclick = function () {
        var color = btn.getAttribute('data-color');
        var kind = btn.getAttribute('data-kind');
        contentEl.focus();
        if (savedColorRange) {
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(savedColorRange);
        }
        if (kind === 'text') {
          document.execCommand('foreColor', false, color);
        } else if (kind === 'box') {
          applyBlockBox(color);
        } else {
          var ok = false;
          try { ok = document.execCommand('hiliteColor', false, color); } catch (e) {}
          if (!ok) { try { document.execCommand('backColor', false, color); } catch (e) {} }
        }
        hidePopovers();
        updatePlaceholder();
      };
    });

    var imageFileInput = document.getElementById('image-file-input');
    document.getElementById('image-btn').onclick = function () {
      var sel = window.getSelection();
      if (sel.rangeCount > 0 && contentEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
      imageFileInput.value = '';
      imageFileInput.click();
    };
    imageFileInput.onchange = function () {
      var file = imageFileInput.files && imageFileInput.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { showToast('Vyber prosím obrázek.'); return; }
      readAndResizeImage(file).then(function (dataUrl) {
        contentEl.focus();
        if (savedRange) {
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(savedRange);
        }
        document.execCommand('insertImage', false, dataUrl);
        updatePlaceholder();
      }).catch(function () { showToast('Obrázek se nepodařilo načíst.'); });
    };

    document.getElementById('video-btn').onclick = function () {
      var sel = window.getSelection();
      if (sel.rangeCount > 0 && contentEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
      videoUrlInput.value = '';
      linkPopover.hidden = true;
      textColorPopover.hidden = true;
      highlightColorPopover.hidden = true;
      boxPopover.hidden = true;
      mdPopover.hidden = true;
      videoPopover.hidden = false;
      videoUrlInput.focus();
    };
    document.getElementById('video-cancel').onclick = function () { videoPopover.hidden = true; };
    document.getElementById('video-apply').onclick = function () {
      var vid = parseYouTubeId(videoUrlInput.value.trim());
      if (!vid) { showToast('Zadej platnou adresu YouTube videa.'); return; }
      var rangeToRestore = savedRange;
      var applyBtn = document.getElementById('video-apply');
      applyBtn.disabled = true;
      applyBtn.textContent = 'Vkládám…';
      videoPopover.hidden = true;
      function insertEmbed(thumbDataUrl) {
        contentEl.focus();
        if (rangeToRestore) {
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(rangeToRestore);
        }
        document.execCommand('insertHTML', false, videoEmbedHtml(vid, thumbDataUrl));
        markVideoEmbedsNonEditable(contentEl);
        updatePlaceholder();
        applyBtn.disabled = false;
        applyBtn.textContent = 'Vložit';
      }
      fetchYouTubeThumbDataUrl(vid).then(insertEmbed).catch(function () { insertEmbed(null); });
    };

    document.getElementById('clear-fmt-btn').onclick = function () {
      var sel = window.getSelection();
      if (!(sel.rangeCount > 0 && contentEl.contains(sel.anchorNode))) {
        showToast('Nejdřív vyber text nebo klikni do odstavce.');
        return;
      }
      contentEl.focus();
      try { document.execCommand('removeFormat'); } catch (e) {}
      try { document.execCommand('unlink'); } catch (e) {}
      sel = window.getSelection();
      if (!sel.rangeCount) return;
      var range = sel.getRangeAt(0);
      var blocks = [];
      Array.prototype.forEach.call(contentEl.querySelectorAll('p,h1,h2,h3,blockquote,li,div'), function (el) {
        if (el.classList.contains('video-embed') || el.closest('.video-embed')) return;
        var hit = false;
        try { hit = range.intersectsNode(el); } catch (e) {}
        if (hit && !range.collapsed && range.endOffset === 0 && el.contains(range.endContainer) && !el.contains(range.startContainer)) hit = false;
        if (hit) blocks.push(el);
      });
      blocks.forEach(function (el) {
        el.removeAttribute('style');
        Array.prototype.forEach.call(el.querySelectorAll('[style]'), function (d) { d.removeAttribute('style'); });
        Array.prototype.forEach.call(el.querySelectorAll('strong,b,em,i,u'), function (d) {
          while (d.firstChild) d.parentNode.insertBefore(d.firstChild, d);
          d.parentNode.removeChild(d);
        });
        if (/^(H1|H2|H3|BLOCKQUOTE)$/.test(el.tagName)) {
          var para = document.createElement('p');
          while (el.firstChild) para.appendChild(el.firstChild);
          el.parentNode.replaceChild(para, el);
        }
      });
      hidePopovers();
      updatePlaceholder();
    };

    document.getElementById('md-btn').onclick = function () {
      var sel = window.getSelection();
      savedRange = (sel.rangeCount > 0 && contentEl.contains(sel.anchorNode)) ? sel.getRangeAt(0).cloneRange() : null;
      hidePopovers();
      mdInput.value = '';
      mdPopover.hidden = false;
      mdInput.focus();
    };
    document.getElementById('md-cancel').onclick = function () { mdPopover.hidden = true; };
    document.getElementById('md-apply').onclick = function () {
      var html = sanitizeHtml(markdownToHtml(mdInput.value));
      if (!html) { showToast('Vlož nejdřív nějaký text.'); return; }
      contentEl.focus();
      var sel = window.getSelection();
      sel.removeAllRanges();
      if (savedRange) {
        sel.addRange(savedRange);
      } else {
        var endRange = document.createRange();
        endRange.selectNodeContents(contentEl);
        endRange.collapse(false);
        sel.addRange(endRange);
      }
      document.execCommand('insertHTML', false, html);
      mdPopover.hidden = true;
      updatePlaceholder();
    };

    document.getElementById('cancel-edit').onclick = function () { closeOverlay(); };

    function runSave(status) {
      var title = document.getElementById('f-title').value.trim();
      var contentHtml = sanitizeHtml(contentEl.innerHTML);
      if (!title || isEditorEmpty(contentEl)) { showToast('Vyplň aspoň titulek a text.'); return; }
      var tags = parseTags(document.getElementById('f-tags').value);
      var excerptInput = document.getElementById('f-excerpt').value.trim();
      var excerpt = excerptInput || makeExcerpt(contentHtml);
      var saveBtn = document.getElementById('save-btn');
      var draftBtn = document.getElementById('draft-btn');
      var busyBtn = status === 'draft' ? draftBtn : saveBtn;
      var busyLabel = busyBtn.textContent;
      saveBtn.disabled = true;
      draftBtn.disabled = true;
      busyBtn.textContent = 'Publikuji…';
      var createdAt = existing ? (existing.createdAt || Date.now()) : Date.now();
      var dateVal = document.getElementById('f-date').value;
      if (dateVal && dateVal !== toDateInput(createdAt)) {
        var picked = new Date(dateVal + 'T12:00:00').getTime();
        if (!isNaN(picked)) createdAt = picked;
      }
      var patch = { title: title, tags: tags, excerpt: excerpt, content: contentHtml, status: status, createdAt: createdAt, updatedAt: Date.now() };
      var promise;
      if (existing) {
        promise = persistUpdate(existing.id, patch);
      } else {
        patch.id = genId();
        patch.updatedAt = createdAt;
        promise = persistNew(patch);
      }
      promise.then(function () {
        showToast(status === 'draft' ? 'Koncept uložen.' : 'Článek publikován.');
        navigateToPost(patch.id || existing.id);
      }).catch(function (err) {
        showToast(publishErrorMessage(err));
        saveBtn.disabled = false;
        draftBtn.disabled = false;
        busyBtn.textContent = busyLabel;
      });
    }

    document.getElementById('save-btn').onclick = function () { runSave('published'); };
    document.getElementById('draft-btn').onclick = function () { runSave('draft'); };
  }

  function openAbout() {
    closeOverlay();
    overlayRoot = document.createElement('div');
    overlayRoot.className = 'overlay';
    overlayRoot.innerHTML =
      '<div class="panel">' +
        '<div class="panel-top"><h2 style="font-size:1.3rem">O blogu</h2>' +
          '<button class="btn btn-ghost" id="close-about">Zavřít</button></div>' +
        '<div class="about-body">' +
          '<p>EdTech blog je veřejný blog o vzdělávacích technologiích — místo pro poznámky a postřehy o nástrojích, LMS platformách, umělé inteligenci ve výuce a dalších změnách, které technologie přinášejí do vzdělávání.</p>' +
          '<p>Číst může kdokoliv, přidávat a upravovat články může jen správce téhle stránky.</p>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlayRoot);
    overlayRoot.addEventListener('click', function (e) { if (e.target === overlayRoot) closeOverlay(); });
    document.getElementById('close-about').onclick = closeOverlay;
  }

  els.newBtn.onclick = function () { openEditor(null); };
  els.homeLink.onclick = function (e) { e.preventDefault(); goHome(); };
  els.articlesLink.onclick = function (e) { e.preventDefault(); goHome(); };
  els.aboutLink.onclick = function (e) { e.preventDefault(); openAbout(); };
  els.search.oninput = function () { state.search = els.search.value; state.page = 1; renderList(); };

  state.posts = loadInitialPosts();
  renderAll();
  routeFromHash();
  initCapabilities();
})();
</script></body></html>
